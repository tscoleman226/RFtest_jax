[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rfjax"
version = "0.1.0"
description = "Random forest permutation tests in JAX"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Tim Coleman"},
]
keywords = ["random-forest", "jax", "permutation-test", "hypothesis-test"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax[cpu]>=0.4.20",
    "jaxlib>=0.4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/timcoleman/RFTest"
Repository = "https://github.com/timcoleman/RFTest"

[tool.hatch.build.targets.wheel]
packages = ["src/rfjax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
